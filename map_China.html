       由王鹤博士创立并领导，隶属北京大学前<br>沿计算研究中心。研究目标是通过发展具<br>身技能及具身多模态大模型，推进通用具<br>身智能的实现。                 </div>             </div>                          <div style="margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:10px;">                                  <div style="font-size:14px; font-weight:bold; color:#00e5ff; margin-bottom:4px;">                     智元机器人联合实验室 (PKU-Agibot)                 </div>                 <div style="font-size:12px; color:#f8fafc; margin-bottom:2px;">                     <span style="opacity:0.7">方向:</span> 机器人视觉、物体操作、语义导航、具身自主决策                 </div>                 <div style="font-size:12px; color:#f8fafc; margin-bottom:4px;">                     <span style="opacity:0.7">人物:</span> 董豪                 </div>                                  <div style="font-size:12px; color:#cbd5e1; line-height:1.4; font-style:italic;">                     成立于2024年，由北大与智元机器人联合<br>成立，探索机器人在复杂环境中的自主感<br>知、决策和执行能力。                 </div>             </div>                          <div style="margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:10px;">                                  <div style="font-size:14px; font-weight:bold; color:#00e5ff; margin-bottom:4px;">                     情感与认知智能机器人实验室 (ACIR)                 </div>                 <div style="font-size:12px; color:#f8fafc; margin-bottom:2px;">                     <span style="opacity:0.7">方向:</span> 情感与认知计算、精细表情识别、注意分析                 </div>                 <div style="font-size:12px; color:#f8fafc; margin-bottom:4px;">                     <span style="opacity:0.7">人物:</span> 王韬                 </div>                                  <div style="font-size:12px; color:#cbd5e1; line-height:1.4; font-style:italic;">                     以赋予机器人真正的智能和情感为发展目<br>标，进行情感与认知计算的学术研究。                 </div>             </div>                          <div style="margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:10
